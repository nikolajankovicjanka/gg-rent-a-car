services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ggrent
      MYSQL_USER: ggrent
      MYSQL_PASSWORD: ggrent_local
      MYSQL_ROOT_PASSWORD: root_local
    ports: ["3309:3306"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_local --silent"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025", "1026:1025"]
  app:
    build: ./docker/php
    working_dir: /var/www/html
    volumes: [./backend:/var/www/html]
    depends_on: [db, redis]
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
  nginx:
    image: nginx:alpine
    ports: ["8088:80"]
    volumes: [./backend:/var/www/html:ro, ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: [./frontend:/app, node_modules:/app/node_modules]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5178:5173"]
volumes:
  db_data:
  node_modules:
