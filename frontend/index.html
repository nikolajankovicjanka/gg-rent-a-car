
<!doctype html>
<html lang="bs">
<head>
    <!-- Basic metadata -->
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#101820" />
    <meta name="color-scheme" content="dark light" />

    <!-- Primary SEO -->
    <title>GG Rent | Rent a Car & VIP Transfer</title>

    <meta
            name="description"
            content="GG Rent VIP Transfer – premium iznajmljivanje vozila i rent a car usluge. Istražite našu flotu, provjerite dostupnost i pošaljite upit za rezervaciju brzo i jednostavno."
    />

    <meta
            name="robots"
            content="index, follow, max-image-preview:large"
    />

    <meta name="author" content="GG Rent VIP Transfer" />
    <meta name="application-name" content="GG Rent" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GG Rent VIP Transfer" />

    <meta
            property="og:title"
            content="GG Rent | Rent a Car & VIP Transfer"
    />

    <meta
            property="og:description"
            content="Premium rent a car i VIP transfer usluge. Pregledajte vozila, provjerite dostupnost i rezervišite jednostavno."
    />

    <meta property="og:locale" content="bs_BA" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
            name="twitter:title"
            content="GG Rent | Rent a Car & VIP Transfer"
    />

    <meta
            name="twitter:description"
            content="Premium iznajmljivanje vozila i VIP transfer usluge."
    />

    <link
            rel="icon"
            type="image/png"
            href="/images/gg-group-logo-black.png"
            media="(prefers-color-scheme: light)"
    />

    <link
            rel="icon"
            type="image/png"
            href="/images/gg-group-logo-white.png"
            media="(prefers-color-scheme: dark)"
    />

    <!-- Performance -->
    <meta name="format-detection" content="telephone=no" />
</head>

<body>
<div id="app"></div>

<script
        type="module"
        src="/src/main.ts"
></script>
</body>
</html>
